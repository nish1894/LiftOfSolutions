<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/src/assets/icon.png" />
    <title>Lift Off Solutions — Answers from your company's documents</title>
    <script>
      /* Apply the saved theme before first paint so dark mode never flashes.
         Light is the default. Same storage key and rules as src/shared/theme.ts. */
      try {
        var saved = localStorage.getItem("liftoff-theme");
        var dark =
          saved === "dark" ||
          (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
