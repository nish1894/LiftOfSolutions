    <meta

    />

    <meta property="og:type" content="website" />

      property="og:description"
      content="LiftOffSol is AI-powered customer support for businesses on the WhatsApp Business Platform. It answers your customers from your own business information and hands over to your team when needed."
    />

    <!-- Meta domain verification for liftoffsol.com (Business settings, Brand safety, Domains). -->
    <meta name="facebook-domain-verification" content="38da3uh9ap561qinufwn3pz5qjk9s1" />
    <script>
      /* Apply the saved theme before first paint so dark mode never flashes.
         Light is the default. Same storage key and rules as src/shared/theme.ts. */
      try {
        var saved = localStorage.getItem("liftoff-theme");
        var dark =
          saved === "dark" ||
          (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
