# Local stack on native Firestore: the Firestore emulator, the same kind of database the RAG reads.
#   docker compose up -d --build
# Sign-in uses real Firebase Auth when .env sets FIREBASE_AUTH_EMULATOR_HOST= and
# VITE_FIREBASE_AUTH_EMULATOR_URL= (empty) and GOOGLE_APPLICATION_CREDENTIALS to a key in untracked/keys.
# Left unset, everything runs on the emulators.
name: liftof-platform

# api-init and maintenance run the image the api service builds.
x-api-image: &api-image
  image: liftof-platform-api:latest
  pull_policy: never

services:
  firebase-emulator:
    image: chatbotbackend-firebase-emulator:latest
    build: { context: ., dockerfile: firebase-emulator/Dockerfile }
    command:
      - sh
      - -c
      # exec makes firebase PID 1, so it gets Docker's SIGTERM and writes the export before exiting.
      # The export goes to a subdirectory of the volume: firebase clears that directory first, which
      # fails on a mount point.
      - if [ -f /data/export/firebase-export-metadata.json ]; then exec firebase emulators:start --project ${FIREBASE_PROJECT_ID:-demo-liftof-platform} --only auth,firestore --import=/data/export --export-on-exit=/data/export; else exec firebase emulators:start --project ${FIREBASE_PROJECT_ID:-demo-liftof-platform} --only auth,firestore --export-on-exit=/data/export; fi
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9099:9099", "127.0.0.1:4000:4000"]
    volumes: ["firestore_data:/data"]
    # Writing the export takes a few seconds; the 10 s default would cut it off.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30

  # Creates the default plan once; onboarding needs it.
  api-init:
    <<: *api-image
    command: ["node", "dist/firestore/provision.js"]
    restart: "no"
    environment:
      APP_ENV: development
      DATABASE_BACKEND: firestore
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-liftof-platform}
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
      DEFAULT_PLAN_CREDITS: ${DEFAULT_PLAN_CREDITS:-1000}
      DEFAULT_PLAN_PROJECTS: ${DEFAULT_PLAN_PROJECTS:-3}
      DEFAULT_PLAN_MEMBERS: ${DEFAULT_PLAN_MEMBERS:-10}
    depends_on:
      firebase-emulator: { condition: service_healthy }

  api:
    image: liftof-platform-api:latest
    build: { context: ./platform-api }
    environment:
      APP_ENV: development
      DATABASE_BACKEND: firestore
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-liftof-platform}
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
      # Empty in .env = real Firebase Auth; GOOGLE_APPLICATION_CREDENTIALS then names a key in /run/keys.
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST-firebase-emulator:9099}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      TERMS_VERSION: development-preview
      # The RAG runs on this Mac (uv run fastapi run src/main.py --port 8001) and downloads uploads from here.
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://host.docker.internal:8001}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      LOCAL_STORAGE_PATH: /app/data/uploads
    volumes: ["./untracked/keys:/run/keys:ro", "uploads:/app/data/uploads"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      api-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The once-a-minute sweeps: credit periods, expired approvals and records, stale runs.
  maintenance:
    <<: *api-image
    command: ["node", "dist/firestore/maintenance.js"]
    environment:
      APP_ENV: development
      DATABASE_BACKEND: firestore
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-liftof-platform}
      FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
      LOCAL_STORAGE_PATH: /app/data/uploads
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      api-init: { condition: service_completed_successfully }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-demo-key}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-demo-liftof-platform.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-liftof-platform}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-demo-app-id}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL-http://localhost:9099}
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  firestore_data:
  # Knowledge uploads wait here until the RAG has read them.
  uploads:
