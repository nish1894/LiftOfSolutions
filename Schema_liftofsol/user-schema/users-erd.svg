<svg xmlns="http://www.w3.org/2000/svg" width="860" height="632" viewBox="0 0 860 632" role="img" aria-labelledby="er-title er-desc">
        <title id="er-title">users entity relationship diagram</title>
        <desc id="er-desc">A user has one or more auth identities, stored in their own collection and unique by provider and subject. Every user has exactly one membership, pointing to their organization, which holds the plan. Settings is an optional object embedded in the user document.</desc>
        <style>
.er-box { fill: #FFFFFF; stroke: #B9C2CC; stroke-width: 1; }
.er-head-main { fill: #0B6B6B; }
.er-head { fill: #E2EFEE; }
.er-sep { stroke: #E1E6EB; stroke-width: 1; }
.er-linkrow { fill: #E2EFEE; }
.er-title-main { font-family: "Instrument Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
.er-tag-main { font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, "DejaVu Sans", sans-serif; font-size: 12px; fill: #FFFFFF; opacity: 0.85; }
.er-title { font-family: "Instrument Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 600; fill: #17202A; }
.er-tag { font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, "DejaVu Sans", sans-serif; font-size: 12px; fill: #5A6474; }
.er-f { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #17202A; }
.er-f.link { fill: #0B6B6B; font-weight: 500; }
.er-ty { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #5A6474; }
.er-pk { fill: #0B6B6B; font-weight: 500; }
.er-line { stroke: #0B6B6B; stroke-width: 1.5; fill: none; }
.er-zero { fill: #FFFFFF; stroke: #0B6B6B; stroke-width: 1.5; }
.er-card { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 500; fill: #0B6B6B; }
        </style>
        <rect width="860" height="632" fill="#FFFFFF"/>

        <!-- users -->
        <rect class="er-box" x="24" y="88" width="300" height="460" rx="8"/>
        <path class="er-head-main" d="M24 96 Q24 88 32 88 H316 Q324 88 324 96 V128 H24 Z"/>
        <text class="er-title-main" x="38" y="113">users</text>
        <text class="er-tag-main" x="310" y="113" text-anchor="end">collection</text>
        <rect class="er-linkrow" x="25" y="352" width="298" height="56"/>
        <line class="er-sep" x1="24" y1="156" x2="324" y2="156"/>
        <line class="er-sep" x1="24" y1="184" x2="324" y2="184"/>
        <line class="er-sep" x1="24" y1="212" x2="324" y2="212"/>
        <line class="er-sep" x1="24" y1="240" x2="324" y2="240"/>
        <line class="er-sep" x1="24" y1="268" x2="324" y2="268"/>
        <line class="er-sep" x1="24" y1="296" x2="324" y2="296"/>
        <line class="er-sep" x1="24" y1="324" x2="324" y2="324"/>
        <line class="er-sep" x1="24" y1="352" x2="324" y2="352"/>
        <line class="er-sep" x1="24" y1="380" x2="324" y2="380"/>
        <line class="er-sep" x1="24" y1="408" x2="324" y2="408"/>
        <line class="er-sep" x1="24" y1="436" x2="324" y2="436"/>
        <line class="er-sep" x1="24" y1="464" x2="324" y2="464"/>
        <line class="er-sep" x1="24" y1="492" x2="324" y2="492"/>
        <line class="er-sep" x1="24" y1="520" x2="324" y2="520"/>
        <text class="er-f" x="38" y="146">_id</text><text class="er-ty" x="310" y="146" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>
        <text class="er-f" x="38" y="174">display_name</text><text class="er-ty" x="310" y="174" text-anchor="end">string</text>
        <text class="er-f" x="38" y="202">email?</text><text class="er-ty" x="310" y="202" text-anchor="end">string, unique</text>
        <text class="er-f" x="38" y="230">phone?</text><text class="er-ty" x="310" y="230" text-anchor="end">E.164 string</text>
        <text class="er-f" x="38" y="258">avatar_url?</text><text class="er-ty" x="310" y="258" text-anchor="end">string</text>
        <text class="er-f" x="38" y="286">dob?</text><text class="er-ty" x="310" y="286" text-anchor="end">YYYY-MM-DD</text>
        <text class="er-f" x="38" y="314">gender?</text><text class="er-ty" x="310" y="314" text-anchor="end">string</text>
        <text class="er-f" x="38" y="342">status</text><text class="er-ty" x="310" y="342" text-anchor="end">active | suspended | deleted</text>
        <text class="er-f link" x="38" y="370">membership</text><text class="er-ty" x="310" y="370" text-anchor="end">object</text>
        <text class="er-f link" x="38" y="398">settings?</text><text class="er-ty" x="310" y="398" text-anchor="end">object</text>
        <text class="er-f" x="38" y="426">terms_accepted_at?</text><text class="er-ty" x="310" y="426" text-anchor="end">date</text>
        <text class="er-f" x="38" y="454">terms_version?</text><text class="er-ty" x="310" y="454" text-anchor="end">string</text>
        <text class="er-f" x="38" y="482">created_at</text><text class="er-ty" x="310" y="482" text-anchor="end">date</text>
        <text class="er-f" x="38" y="510">updated_at</text><text class="er-ty" x="310" y="510" text-anchor="end">date</text>
        <text class="er-f" x="38" y="538">deleted_at?</text><text class="er-ty" x="310" y="538" text-anchor="end">date</text>

        <!-- auth_identities -->
        <rect class="er-box" x="536" y="24" width="300" height="180" rx="8"/>
        <path class="er-head" d="M536 32 Q536 24 544 24 H828 Q836 24 836 32 V64 H536 Z"/>
        <text class="er-title" x="550" y="49">auth_identities</text>
        <text class="er-tag" x="822" y="49" text-anchor="end">collection</text>
        <line class="er-sep" x1="536" y1="64" x2="836" y2="64"/>
        <line class="er-sep" x1="536" y1="92" x2="836" y2="92"/>
        <line class="er-sep" x1="536" y1="120" x2="836" y2="120"/>
        <line class="er-sep" x1="536" y1="148" x2="836" y2="148"/>
        <line class="er-sep" x1="536" y1="176" x2="836" y2="176"/>
        <text class="er-f" x="550" y="82">_id</text><text class="er-ty" x="822" y="82" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>
        <text class="er-f link" x="550" y="110">user_id</text><text class="er-ty" x="822" y="110" text-anchor="end">uuid FK → users</text>
        <text class="er-f" x="550" y="138">provider</text><text class="er-ty" x="822" y="138" text-anchor="end">firebase | local</text>
        <text class="er-f" x="550" y="166">subject</text><text class="er-ty" x="822" y="166" text-anchor="end">string</text>
        <text class="er-f" x="550" y="194">created_at</text><text class="er-ty" x="822" y="194" text-anchor="end">date</text>
        <text class="er-tag" x="822" y="226" text-anchor="end">unique: provider + subject</text>

        <!-- membership -->
        <rect class="er-box" x="536" y="252" width="300" height="152" rx="8"/>
        <path class="er-head" d="M536 260 Q536 252 544 252 H828 Q836 252 836 260 V292 H536 Z"/>
        <text class="er-title" x="550" y="277">membership</text>
        <text class="er-tag" x="822" y="277" text-anchor="end">object, always</text>
        <line class="er-sep" x1="536" y1="292" x2="836" y2="292"/>
        <line class="er-sep" x1="536" y1="320" x2="836" y2="320"/>
        <line class="er-sep" x1="536" y1="348" x2="836" y2="348"/>
        <line class="er-sep" x1="536" y1="376" x2="836" y2="376"/>
        <text class="er-f" x="550" y="310">org_id</text><text class="er-ty" x="822" y="310" text-anchor="end">uuid FK → organizations</text>
        <text class="er-f" x="550" y="338">role</text><text class="er-ty" x="822" y="338" text-anchor="end">owner | admin | member</text>
        <text class="er-f" x="550" y="366">created_at</text><text class="er-ty" x="822" y="366" text-anchor="end">date</text>
        <text class="er-f" x="550" y="394">updated_at</text><text class="er-ty" x="822" y="394" text-anchor="end">date</text>

        <!-- settings -->
        <rect class="er-box" x="536" y="428" width="300" height="180" rx="8"/>
        <path class="er-head" d="M536 436 Q536 428 544 428 H828 Q836 428 836 436 V468 H536 Z"/>
        <text class="er-title" x="550" y="453">settings</text>
        <text class="er-tag" x="822" y="453" text-anchor="end">object, optional</text>
        <line class="er-sep" x1="536" y1="468" x2="836" y2="468"/>
        <line class="er-sep" x1="536" y1="496" x2="836" y2="496"/>
        <line class="er-sep" x1="536" y1="524" x2="836" y2="524"/>
        <line class="er-sep" x1="536" y1="552" x2="836" y2="552"/>
        <line class="er-sep" x1="536" y1="580" x2="836" y2="580"/>
        <text class="er-f" x="550" y="486">theme?</text><text class="er-ty" x="822" y="486" text-anchor="end">light | dark | system</text>
        <text class="er-f" x="550" y="514">language?</text><text class="er-ty" x="822" y="514" text-anchor="end">string</text>
        <text class="er-f" x="550" y="542">timezone?</text><text class="er-ty" x="822" y="542" text-anchor="end">string</text>
        <text class="er-f" x="550" y="570">notifications.email?</text><text class="er-ty" x="822" y="570" text-anchor="end">bool</text>
        <text class="er-f" x="550" y="598">notifications.product_updates?</text><text class="er-ty" x="822" y="598" text-anchor="end">bool</text>

        <!-- users to auth_identities: one to one-or-more -->
        <path class="er-line" d="M324 142 H360 V44 H536"/>
        <line class="er-line" x1="333" y1="136" x2="333" y2="148"/>
        <line class="er-line" x1="339" y1="136" x2="339" y2="148"/>
        <line class="er-line" x1="514" y1="37" x2="514" y2="51"/>
        <path class="er-line" d="M522 44 L536 36 M522 44 L536 52"/>
        <text class="er-card" x="440" y="34" text-anchor="middle">1 : N</text>

        <!-- users to membership: one to exactly one -->
        <path class="er-line" d="M324 366 H385 V272 H536"/>
        <line class="er-line" x1="333" y1="360" x2="333" y2="372"/>
        <line class="er-line" x1="339" y1="360" x2="339" y2="372"/>
        <line class="er-line" x1="521" y1="265" x2="521" y2="279"/>
        <line class="er-line" x1="527" y1="265" x2="527" y2="279"/>
        <text class="er-card" x="455" y="262" text-anchor="middle">1 : 1</text>

        <!-- users to settings: one to zero-or-one -->
        <path class="er-line" d="M324 394 H410 V448 H536"/>
        <line class="er-line" x1="333" y1="388" x2="333" y2="400"/>
        <line class="er-line" x1="339" y1="388" x2="339" y2="400"/>
        <line class="er-line" x1="527" y1="441" x2="527" y2="455"/>
        <circle class="er-zero" cx="515" cy="448" r="4.5"/>
        <text class="er-card" x="470" y="438" text-anchor="middle">1 : 0..1</text>
      </svg>
