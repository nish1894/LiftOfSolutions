<svg xmlns="http://www.w3.org/2000/svg" width="864" height="480" viewBox="0 0 864 480" role="img" aria-labelledby="er-title er-desc">
        <title id="er-title">audit events entity relationship diagram</title>
        <desc id="er-desc">Each audit event belongs to one organization, optionally to a project, and was done by a user, the system, or the platform team. Only the fields that changed are recorded. Events are deleted automatically 365 days after they are created.</desc>
        <style>
.er-box { fill: #FFFFFF; stroke: #B9C2CC; stroke-width: 1; }
.er-box-ref { fill: #FFFFFF; stroke: #5A6474; stroke-width: 1; stroke-dasharray: 5 4; }
.er-head-main { fill: #0B6B6B; }
.er-head { fill: #E2EFEE; }
.er-head-ref { fill: #EDF0F3; }
.er-sep { stroke: #E1E6EB; stroke-width: 1; }
.er-linkrow { fill: #E2EFEE; }
.er-title-main { font-family: "Instrument Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
.er-tag-main { font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, "DejaVu Sans", sans-serif; font-size: 12px; fill: #FFFFFF; opacity: 0.85; }
.er-title { font-family: "Instrument Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 600; fill: #17202A; }
.er-tag { font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, "DejaVu Sans", sans-serif; font-size: 12px; fill: #5A6474; }
.er-f { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #17202A; }
.er-f.link { fill: #0B6B6B; font-weight: 500; }
.er-ty { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #5A6474; }
.er-pk { fill: #0B6B6B; font-weight: 500; }
.er-line { stroke: #0B6B6B; stroke-width: 1.5; fill: none; }
.er-zero { fill: #FFFFFF; stroke: #0B6B6B; stroke-width: 1.5; }
.er-card { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 500; fill: #0B6B6B; }
        
        </style>
        <rect width="864" height="480" fill="#FFFFFF"/>

        <!-- organizations -->
        <rect class="er-box-ref" x="24" y="24" width="300" height="68" rx="8"/>
        <path class="er-head-ref" d="M24 32 Q24 24 32 24 H316 Q324 24 324 32 V64 H24 Z"/>
        <text class="er-title" x="38" y="49">organizations</text>
        <text class="er-tag" x="310" y="49" text-anchor="end">from Organization schema</text>
        <line class="er-sep" x1="24" y1="64" x2="324" y2="64"/>
        <text class="er-f" x="38" y="82">_id</text><text class="er-ty" x="310" y="82" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>

        <!-- users -->
        <rect class="er-box-ref" x="24" y="140" width="300" height="68" rx="8"/>
        <path class="er-head-ref" d="M24 148 Q24 140 32 140 H316 Q324 140 324 148 V180 H24 Z"/>
        <text class="er-title" x="38" y="165">users</text>
        <text class="er-tag" x="310" y="165" text-anchor="end">from User schema</text>
        <line class="er-sep" x1="24" y1="180" x2="324" y2="180"/>
        <text class="er-f" x="38" y="198">_id</text><text class="er-ty" x="310" y="198" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>

        <!-- projects -->
        <rect class="er-box-ref" x="24" y="256" width="300" height="68" rx="8"/>
        <path class="er-head-ref" d="M24 264 Q24 256 32 256 H316 Q324 256 324 264 V296 H24 Z"/>
        <text class="er-title" x="38" y="281">projects</text>
        <text class="er-tag" x="310" y="281" text-anchor="end">from Project schema</text>
        <line class="er-sep" x1="24" y1="296" x2="324" y2="296"/>
        <text class="er-f" x="38" y="314">_id</text><text class="er-ty" x="310" y="314" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>

        <!-- audit_events -->
        <rect class="er-box" x="540" y="24" width="300" height="432" rx="8"/>
        <rect class="er-linkrow" x="541" y="92" width="298" height="28"/>
        <rect class="er-linkrow" x="541" y="148" width="298" height="28"/>
        <rect class="er-linkrow" x="541" y="176" width="298" height="28"/>
        <path class="er-head-main" d="M540 32 Q540 24 548 24 H832 Q840 24 840 32 V64 H540 Z"/>
        <text class="er-title-main" x="554" y="49">audit_events</text>
        <text class="er-tag-main" x="826" y="49" text-anchor="end">collection, TTL 365 days</text>
        <line class="er-sep" x1="540" y1="92" x2="840" y2="92"/>
        <line class="er-sep" x1="540" y1="120" x2="840" y2="120"/>
        <line class="er-sep" x1="540" y1="148" x2="840" y2="148"/>
        <line class="er-sep" x1="540" y1="176" x2="840" y2="176"/>
        <line class="er-sep" x1="540" y1="204" x2="840" y2="204"/>
        <line class="er-sep" x1="540" y1="232" x2="840" y2="232"/>
        <line class="er-sep" x1="540" y1="260" x2="840" y2="260"/>
        <line class="er-sep" x1="540" y1="288" x2="840" y2="288"/>
        <line class="er-sep" x1="540" y1="316" x2="840" y2="316"/>
        <line class="er-sep" x1="540" y1="344" x2="840" y2="344"/>
        <line class="er-sep" x1="540" y1="372" x2="840" y2="372"/>
        <line class="er-sep" x1="540" y1="400" x2="840" y2="400"/>
        <line class="er-sep" x1="540" y1="428" x2="840" y2="428"/>
        <text class="er-f" x="554" y="82">_id</text><text class="er-ty" x="826" y="82" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>
        <text class="er-f link" x="554" y="110">org_id</text><text class="er-ty" x="826" y="110" text-anchor="end">uuid FK</text>
        <text class="er-f" x="554" y="138">actor_type</text><text class="er-ty" x="826" y="138" text-anchor="end">user | system | platform</text>
        <text class="er-f link" x="554" y="166">actor_user_id?</text><text class="er-ty" x="826" y="166" text-anchor="end">uuid FK</text>
        <text class="er-f link" x="554" y="194">project_id?</text><text class="er-ty" x="826" y="194" text-anchor="end">uuid FK</text>
        <text class="er-f" x="554" y="222">action</text><text class="er-ty" x="826" y="222" text-anchor="end">string</text>
        <text class="er-f" x="554" y="250">resource_type</text><text class="er-ty" x="826" y="250" text-anchor="end">string</text>
        <text class="er-f" x="554" y="278">resource_id?</text><text class="er-ty" x="826" y="278" text-anchor="end">string</text>
        <text class="er-f" x="554" y="306">changes?</text><text class="er-ty" x="826" y="306" text-anchor="end">{ before, after }</text>
        <text class="er-f" x="554" y="334">request_id?</text><text class="er-ty" x="826" y="334" text-anchor="end">string</text>
        <text class="er-f" x="554" y="362">ip_address?</text><text class="er-ty" x="826" y="362" text-anchor="end">string</text>
        <text class="er-f" x="554" y="390">user_agent?</text><text class="er-ty" x="826" y="390" text-anchor="end">string</text>
        <text class="er-f" x="554" y="418">created_at</text><text class="er-ty" x="826" y="418" text-anchor="end">date</text>
        <text class="er-f" x="554" y="446">expires_at</text><text class="er-ty" x="826" y="446" text-anchor="end">date, TTL</text>

        <!-- organizations to audit_events: one to zero-or-more -->
        <path class="er-line" d="M324 78 H430 V106 H540"/>
        <line class="er-line" x1="333" y1="71" x2="333" y2="85"/>
        <line class="er-line" x1="339" y1="71" x2="339" y2="85"/>
        <path class="er-line" d="M526 106 L540 114 M526 106 L540 98"/>
        <circle class="er-zero" cx="517" cy="106" r="4.5"/>
        <text class="er-card" x="330" y="68" text-anchor="start">1 : 0..N</text>

        <!-- users to audit_events: zero-or-one to zero-or-more (actor) -->
        <path class="er-line" d="M324 194 H460 V162 H540"/>
        <line class="er-line" x1="333" y1="187" x2="333" y2="201"/>
        <circle class="er-zero" cx="345" cy="194" r="4.5"/>
        <path class="er-line" d="M526 162 L540 170 M526 162 L540 154"/>
        <circle class="er-zero" cx="517" cy="162" r="4.5"/>
        <text class="er-card" x="334" y="184" text-anchor="start">0..1 : 0..N</text>

        <!-- projects to audit_events: zero-or-one to zero-or-more -->
        <path class="er-line" d="M324 310 H490 V190 H540"/>
        <line class="er-line" x1="333" y1="303" x2="333" y2="317"/>
        <circle class="er-zero" cx="345" cy="310" r="4.5"/>
        <path class="er-line" d="M526 190 L540 198 M526 190 L540 182"/>
        <circle class="er-zero" cx="517" cy="190" r="4.5"/>
        <text class="er-card" x="334" y="300" text-anchor="start">0..1 : 0..N</text>
      </svg>
