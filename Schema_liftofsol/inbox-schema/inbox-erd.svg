        <text class="er-f" x="918" y="368">mime_type</text><text class="er-ty" x="1190" y="368" text-anchor="end">string</text>
        <text class="er-f" x="918" y="396">name?</text><text class="er-ty" x="1190" y="396" text-anchor="end">string</text>
        <text class="er-f" x="918" y="424">size_bytes?</text><text class="er-ty" x="1190" y="424" text-anchor="end">int</text>

        <!-- event_data -->
        <rect class="er-box" x="904" y="500" width="300" height="124" rx="8"/>
        <path class="er-head" d="M904 508 Q904 500 912 500 H1196 Q1204 500 1204 508 V540 H904 Z"/>
        <text class="er-title" x="918" y="525">event_data</text>
        <text class="er-tag" x="1190" y="525" text-anchor="end">embedded, system messages</text>
        <line class="er-sep" x1="904" y1="540" x2="1204" y2="540"/>
        <line class="er-sep" x1="904" y1="568" x2="1204" y2="568"/>
        <line class="er-sep" x1="904" y1="596" x2="1204" y2="596"/>
        <text class="er-f" x="918" y="558">from_user_id?</text><text class="er-ty" x="1190" y="558" text-anchor="end">uuid FK → users</text>
        <text class="er-f" x="918" y="586">to_user_id?</text><text class="er-ty" x="1190" y="586" text-anchor="end">uuid FK → users</text>
        <text class="er-f" x="918" y="614">reason?</text><text class="er-ty" x="1190" y="614" text-anchor="end">string</text>

        <!-- conversations to messages: one to zero-or-more -->
        <path class="er-line" d="M324 78 H394 V106 H464"/>
        <line class="er-line" x1="333" y1="71" x2="333" y2="85"/>
        <line class="er-line" x1="339" y1="71" x2="339" y2="85"/>
        <path class="er-line" d="M450 106 L464 114 M450 106 L464 98"/>
        <circle class="er-zero" cx="441" cy="106" r="4.5"/>
        <text class="er-card" x="330" y="68" text-anchor="start">1 : 0..N</text>

        <!-- messages to citations: one to zero-or-more (embedded) -->
        <path class="er-line" d="M764 274 H834 V64 H904"/>
        <line class="er-line" x1="773" y1="267" x2="773" y2="281"/>
        <line class="er-line" x1="779" y1="267" x2="779" y2="281"/>
        <path class="er-line" d="M890 64 L904 72 M890 64 L904 56"/>
        <circle class="er-zero" cx="881" cy="64" r="4.5"/>
        <text class="er-card" x="842" y="180" text-anchor="start">1 : 0..N</text>

        <!-- messages to attachments: one to zero-or-more (embedded) -->
        <path class="er-line" d="M764 302 H904"/>
        <line class="er-line" x1="773" y1="295" x2="773" y2="309"/>
        <line class="er-line" x1="779" y1="295" x2="779" y2="309"/>
        <path class="er-line" d="M890 302 L904 310 M890 302 L904 294"/>
        <circle class="er-zero" cx="881" cy="302" r="4.5"/>
        <text class="er-card" x="834" y="292" text-anchor="middle">1 : 0..N</text>

        <!-- messages to event_data: one to zero-or-one (embedded) -->
        <path class="er-line" d="M764 386 H850 V520 H904"/>
        <line class="er-line" x1="773" y1="379" x2="773" y2="393"/>
        <line class="er-line" x1="779" y1="379" x2="779" y2="393"/>
        <line class="er-line" x1="895" y1="527" x2="895" y2="513"/>
        <circle class="er-zero" cx="883" cy="520" r="4.5"/>
        <text class="er-card" x="858" y="470" text-anchor="start">1 : 0..1</text>
        <text class="er-tag" x="38" y="622" text-anchor="start">status: ai_active → waiting_for_agent → agent_active → resolved → closed</text>
        <text class="er-tag" x="38" y="642" text-anchor="start">handoffs = status + assigned_user_id on the conversation, each step a system message</text>
      </svg>
