<svg xmlns="http://www.w3.org/2000/svg" width="1228" height="624" viewBox="0 0 1228 624" role="img" aria-labelledby="er-title er-desc">
        <title id="er-title">projects entity relationship diagram</title>
        <desc id="er-desc">An organization has zero or more projects. Each project holds optional role-based permissions and an embedded list of members with per-person grants and denies; each member is a user. Agents, credentials, knowledge, transactions and agent storage on the agent side belong to a project.</desc>
        <style>
.er-box { fill: #FFFFFF; stroke: #B9C2CC; stroke-width: 1; }
.er-box-ref { fill: #FFFFFF; stroke: #5A6474; stroke-width: 1; stroke-dasharray: 5 4; }
.er-head-main { fill: #0B6B6B; }
.er-head { fill: #E2EFEE; }
.er-head-ref { fill: #EDF0F3; }
.er-sep { stroke: #E1E6EB; stroke-width: 1; }
.er-linkrow { fill: #E2EFEE; }
.er-title-main { font-family: "Instrument Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; }
.er-tag-main { font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, "DejaVu Sans", sans-serif; font-size: 12px; fill: #FFFFFF; opacity: 0.85; }
.er-title { font-family: "Instrument Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 600; fill: #17202A; }
.er-tag { font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, "DejaVu Sans", sans-serif; font-size: 12px; fill: #5A6474; }
.er-f { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #17202A; }
.er-f.link { fill: #0B6B6B; font-weight: 500; }
.er-ty { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #5A6474; }
.er-pk { fill: #0B6B6B; font-weight: 500; }
.er-line { stroke: #0B6B6B; stroke-width: 1.5; fill: none; }
.er-zero { fill: #FFFFFF; stroke: #0B6B6B; stroke-width: 1.5; }
.er-card { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 500; fill: #0B6B6B; }
        
        </style>
        <rect width="1228" height="624" fill="#FFFFFF"/>

        <!-- organizations -->
        <rect class="er-box-ref" x="24" y="24" width="300" height="68" rx="8"/>
        <path class="er-head-ref" d="M24 32 Q24 24 32 24 H316 Q324 24 324 32 V64 H24 Z"/>
        <text class="er-title" x="38" y="49">organizations</text>
        <text class="er-tag" x="310" y="49" text-anchor="end">from Organization schema</text>
        <line class="er-sep" x1="24" y1="64" x2="324" y2="64"/>
        <text class="er-f" x="38" y="82">_id</text><text class="er-ty" x="310" y="82" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>

        <!-- users -->
        <rect class="er-box-ref" x="24" y="168" width="300" height="96" rx="8"/>
        <path class="er-head-ref" d="M24 176 Q24 168 32 168 H316 Q324 168 324 176 V208 H24 Z"/>
        <text class="er-title" x="38" y="193">users</text>
        <text class="er-tag" x="310" y="193" text-anchor="end">from User schema</text>
        <line class="er-sep" x1="24" y1="208" x2="324" y2="208"/>
        <line class="er-sep" x1="24" y1="236" x2="324" y2="236"/>
        <text class="er-f" x="38" y="226">_id</text><text class="er-ty" x="310" y="226" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>
        <text class="er-f" x="38" y="254">membership.role</text><text class="er-ty" x="310" y="254" text-anchor="end">enum</text>

        <!-- projects -->
        <rect class="er-box" x="464" y="24" width="300" height="348" rx="8"/>
        <rect class="er-linkrow" x="465" y="92" width="298" height="28"/>
        <rect class="er-linkrow" x="465" y="204" width="298" height="28"/>
        <rect class="er-linkrow" x="465" y="232" width="298" height="28"/>
        <path class="er-head-main" d="M464 32 Q464 24 472 24 H756 Q764 24 764 32 V64 H464 Z"/>
        <text class="er-title-main" x="478" y="49">projects</text>
        <text class="er-tag-main" x="750" y="49" text-anchor="end">collection</text>
        <line class="er-sep" x1="464" y1="92" x2="764" y2="92"/>
        <line class="er-sep" x1="464" y1="120" x2="764" y2="120"/>
        <line class="er-sep" x1="464" y1="148" x2="764" y2="148"/>
        <line class="er-sep" x1="464" y1="176" x2="764" y2="176"/>
        <line class="er-sep" x1="464" y1="204" x2="764" y2="204"/>
        <line class="er-sep" x1="464" y1="232" x2="764" y2="232"/>
        <line class="er-sep" x1="464" y1="260" x2="764" y2="260"/>
        <line class="er-sep" x1="464" y1="288" x2="764" y2="288"/>
        <line class="er-sep" x1="464" y1="316" x2="764" y2="316"/>
        <line class="er-sep" x1="464" y1="344" x2="764" y2="344"/>
        <text class="er-f" x="478" y="82">_id</text><text class="er-ty" x="750" y="82" text-anchor="end">uuid <tspan class="er-pk">PK</tspan></text>
        <text class="er-f link" x="478" y="110">org_id</text><text class="er-ty" x="750" y="110" text-anchor="end">uuid FK</text>
        <text class="er-f" x="478" y="138">name</text><text class="er-ty" x="750" y="138" text-anchor="end">string</text>
        <text class="er-f" x="478" y="166">description?</text><text class="er-ty" x="750" y="166" text-anchor="end">string</text>
        <text class="er-f" x="478" y="194">status</text><text class="er-ty" x="750" y="194" text-anchor="end">active | archived | deleted</text>
        <text class="er-f link" x="478" y="222">role_permissions?</text><text class="er-ty" x="750" y="222" text-anchor="end">object</text>
        <text class="er-f link" x="478" y="250">members</text><text class="er-ty" x="750" y="250" text-anchor="end">array</text>
        <text class="er-f" x="478" y="278">created_by</text><text class="er-ty" x="750" y="278" text-anchor="end">uuid FK → users</text>
        <text class="er-f" x="478" y="306">created_at</text><text class="er-ty" x="750" y="306" text-anchor="end">date</text>
        <text class="er-f" x="478" y="334">updated_at</text><text class="er-ty" x="750" y="334" text-anchor="end">date</text>
        <text class="er-f" x="478" y="362">deleted_at?</text><text class="er-ty" x="750" y="362" text-anchor="end">date</text>

        <!-- members -->
        <rect class="er-box" x="464" y="420" width="300" height="180" rx="8"/>
        <rect class="er-linkrow" x="465" y="460" width="298" height="28"/>
        <path class="er-head" d="M464 428 Q464 420 472 420 H756 Q764 420 764 428 V460 H464 Z"/>
        <text class="er-title" x="478" y="445">members</text>
        <text class="er-tag" x="750" y="445" text-anchor="end">embedded, per person</text>
        <line class="er-sep" x1="464" y1="460" x2="764" y2="460"/>
        <line class="er-sep" x1="464" y1="488" x2="764" y2="488"/>
        <line class="er-sep" x1="464" y1="516" x2="764" y2="516"/>
        <line class="er-sep" x1="464" y1="544" x2="764" y2="544"/>
        <line class="er-sep" x1="464" y1="572" x2="764" y2="572"/>
        <text class="er-f link" x="478" y="478">user_id</text><text class="er-ty" x="750" y="478" text-anchor="end">uuid FK</text>
        <text class="er-f" x="478" y="506">grants</text><text class="er-ty" x="750" y="506" text-anchor="end">permission[]</text>
        <text class="er-f" x="478" y="534">denies</text><text class="er-ty" x="750" y="534" text-anchor="end">permission[]</text>
        <text class="er-f" x="478" y="562">added_by</text><text class="er-ty" x="750" y="562" text-anchor="end">uuid FK → users</text>
        <text class="er-f" x="478" y="590">added_at</text><text class="er-ty" x="750" y="590" text-anchor="end">date</text>

        <!-- agent side -->
        <rect class="er-box-ref" x="904" y="24" width="300" height="208" rx="8"/>
        <path class="er-head-ref" d="M904 32 Q904 24 912 24 H1196 Q1204 24 1204 32 V64 H904 Z"/>
        <text class="er-title" x="918" y="49">agent side</text>
        <text class="er-tag" x="1190" y="49" text-anchor="end">other schemas</text>
        <line class="er-sep" x1="904" y1="64" x2="1204" y2="64"/>
        <line class="er-sep" x1="904" y1="92" x2="1204" y2="92"/>
        <line class="er-sep" x1="904" y1="120" x2="1204" y2="120"/>
        <line class="er-sep" x1="904" y1="148" x2="1204" y2="148"/>
        <line class="er-sep" x1="904" y1="176" x2="1204" y2="176"/>
        <line class="er-sep" x1="904" y1="204" x2="1204" y2="204"/>
        <text class="er-f" x="918" y="82">agents.project_id</text><text class="er-ty" x="1190" y="82" text-anchor="end">uuid FK</text>
        <text class="er-f" x="918" y="110">credentials.project_id</text><text class="er-ty" x="1190" y="110" text-anchor="end">uuid FK</text>
        <text class="er-f" x="918" y="138">rags.project_id</text><text class="er-ty" x="1190" y="138" text-anchor="end">uuid FK</text>
        <text class="er-f" x="918" y="166">rag_documents.project_id</text><text class="er-ty" x="1190" y="166" text-anchor="end">uuid FK</text>
        <text class="er-f" x="918" y="194">transactions.project_id</text><text class="er-ty" x="1190" y="194" text-anchor="end">uuid FK</text>
        <text class="er-f" x="918" y="222">agent_storage.project_id</text><text class="er-ty" x="1190" y="222" text-anchor="end">uuid FK</text>

        <!-- role_permissions -->
        <rect class="er-box" x="904" y="312" width="300" height="96" rx="8"/>
        <path class="er-head" d="M904 320 Q904 312 912 312 H1196 Q1204 312 1204 320 V352 H904 Z"/>
        <text class="er-title" x="918" y="337">role_permissions</text>
        <text class="er-tag" x="1190" y="337" text-anchor="end">embedded, optional</text>
        <line class="er-sep" x1="904" y1="352" x2="1204" y2="352"/>
        <line class="er-sep" x1="904" y1="380" x2="1204" y2="380"/>
        <text class="er-f" x="918" y="370">admin?</text><text class="er-ty" x="1190" y="370" text-anchor="end">permission[]</text>
        <text class="er-f" x="918" y="398">member?</text><text class="er-ty" x="1190" y="398" text-anchor="end">permission[]</text>

        <!-- organizations to projects: one to zero-or-more -->
        <path class="er-line" d="M324 78 H394 V106 H464"/>
        <line class="er-line" x1="333" y1="71" x2="333" y2="85"/>
        <line class="er-line" x1="339" y1="71" x2="339" y2="85"/>
        <path class="er-line" d="M450 106 L464 114 M450 106 L464 98"/>
        <circle class="er-zero" cx="441" cy="106" r="4.5"/>
        <text class="er-card" x="330" y="68" text-anchor="start">1 : 0..N</text>

        <!-- users to members: one to zero-or-more (one entry per project) -->
        <path class="er-line" d="M324 222 H380 V474 H464"/>
        <line class="er-line" x1="333" y1="215" x2="333" y2="229"/>
        <line class="er-line" x1="339" y1="215" x2="339" y2="229"/>
        <path class="er-line" d="M450 474 L464 482 M450 474 L464 466"/>
        <circle class="er-zero" cx="441" cy="474" r="4.5"/>
        <text class="er-card" x="386" y="400" text-anchor="start">1 : 0..N</text>

        <!-- projects to members: one to zero-or-more (embedded) -->
        <path class="er-line" d="M614 372 V420"/>
        <line class="er-line" x1="621" y1="381" x2="607" y2="381"/>
        <line class="er-line" x1="621" y1="387" x2="607" y2="387"/>
        <path class="er-line" d="M614 406 L606 420 M614 406 L622 420"/>
        <circle class="er-zero" cx="614" cy="397" r="4.5"/>
        <text class="er-card" x="626" y="402" text-anchor="start">1 : 0..N</text>

        <!-- projects to agent-side records: one to zero-or-more (project_id) -->
        <path class="er-line" d="M764 78 H904"/>
        <line class="er-line" x1="773" y1="71" x2="773" y2="85"/>
        <line class="er-line" x1="779" y1="71" x2="779" y2="85"/>
        <path class="er-line" d="M890 78 L904 86 M890 78 L904 70"/>
        <circle class="er-zero" cx="881" cy="78" r="4.5"/>
        <text class="er-card" x="834" y="68" text-anchor="middle">1 : 0..N</text>

        <!-- projects to role_permissions: one to zero-or-one (embedded) -->
        <path class="er-line" d="M764 218 H834 V352 H904"/>
        <line class="er-line" x1="773" y1="211" x2="773" y2="225"/>
        <line class="er-line" x1="779" y1="211" x2="779" y2="225"/>
        <line class="er-line" x1="895" y1="359" x2="895" y2="345"/>
        <circle class="er-zero" cx="883" cy="352" r="4.5"/>
        <text class="er-card" x="842" y="250" text-anchor="start">1 : 0..1</text>
      </svg>
