[project]
name = "chatbot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain>=1.3.11",
    "langchain-deepseek>=1.1.0",
    "langchain-google-genai>=4.2.7",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.8",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
